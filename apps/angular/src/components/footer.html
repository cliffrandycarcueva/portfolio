<footer>
  <div>
    <a href="#about" class="brand font-heading text-[23px] font-extrabold tracking-[-2px] text-ink"
      >{{ profile.brand }}<span>.</span></a
    ><span>© {{ year }} {{ profile.name }}</span>
    <button
      class="owner-entry"
      aria-label="Owner sign in"
      title="Owner sign in"
      (click)="openOwner()"
    >
      ◦
    </button>
  </div>
  <span class="footer-location max-tablet:hidden"
    >Built with care in {{ profile.location.short }}</span
  >
  <div><portfolio-social-links variant="text"></portfolio-social-links></div>
</footer>
